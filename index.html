<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tiny Crowns</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b3a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiny Crowns">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="topbar">
      <div class="res" id="res-wood"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_02.png" alt=""><span>0</span></div>
      <div class="res" id="res-gold"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_03.png" alt=""><span>0</span></div>
      <div class="res" id="res-meat"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_04.png" alt=""><span>0</span></div>
      <div class="res" id="res-pawns"><img src="assets/packs/free/UI Elements/UI Elements/Human Avatars/Avatars_05.png" alt=""><span>0/0</span></div>
    </div>

    <div id="bottombar">
      <button class="navbtn" data-panel="jobs"><img src="assets/packs/free/UI Elements/UI Elements/Human Avatars/Avatars_05.png" alt=""><span>Pawns</span></button>
      <button class="navbtn" data-panel="build"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_01.png" alt=""><span>Build</span></button>
      <button class="navbtn" data-panel="heroes"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_05.png" alt=""><span>Heroes</span></button>
      <button class="navbtn" data-panel="campaign"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_07.png" alt=""><span>Campaign</span></button>
    </div>

    <div id="panel" class="hidden">
      <div class="paper"><div id="panel-body"></div></div>
      <button id="panel-close" aria-label="Close"><img src="assets/packs/free/UI Elements/UI Elements/Icons/Icon_09.png" alt=""></button>
    </div>

    <div id="toast" class="hidden"></div>

    <div id="battlehud" class="hidden">
      <div id="bh-title" class="kbanner small"></div>
      <div id="bh-bottom">
        <button id="bh-retreat" class="sbtn red wbtn">Retreat</button>
        <button id="bh-rally" aria-label="King's Rally">
          <img id="bh-king" alt="">
          <div class="meter"><div id="bh-meter"></div></div>
          <span>Rally</span>
        </button>
        <button id="bh-speed" class="sbtn wbtn">x1</button>
      </div>
      <div id="bh-result" class="hidden"><div class="paper"><div id="bh-result-body"></div></div></div>
    </div>
    <div id="cutin" class="hidden"><img id="cutin-img" alt=""><div>Royal Rally!</div></div>
  </div>

  <div id="reveal" class="hidden">
    <div class="rays"></div>
    <img id="reveal-img" alt="">
    <div id="reveal-text"></div>
    <div class="tapnote">Tap to continue</div>
  </div>

  <div id="kingdom" class="hidden">
    <div class="kbanner">Choose your Kingdom</div>
    <div id="kpicks"></div>
    <div class="paper kinfo"><div id="kdetail"></div></div>
    <button id="kstart" class="bigbtn">Found Kingdom</button>
  </div>

  <div id="loading">
    <img src="icons/icon-512.png" alt="">
    <div class="bar"><div id="loadfill"></div></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
